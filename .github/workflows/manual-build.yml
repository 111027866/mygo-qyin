name: Manual release build

on:
  workflow_dispatch:
  push:
    branches:
      - main       # 同步 upstream 到 main 分支时自动触发
    tags:
      - 'v*'       # 同步到版本标签时也会自动触发

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install NSIS
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build packages
        env:
          CGO_ENABLED: "0"
        run: |
          go tool mygo build -platform "${{ matrix.platform }}"

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            build/SHA256SUMS
            build/*/*.dmg
            build/*/*-setup-*.exe
            build/*/*.deb
            build/*/*.tar.gz
            build/*/*.delta
            build/*/update-*.json
            build/*/install.sh
            build/*/install.ps1
          if-no-files-found: warn
          retention-days: 7

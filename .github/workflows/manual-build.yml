name: Manual release build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest # 两者都在 ubuntu 上交叉编译即可，无需 mac 机器
    strategy:
      fail-fast: false
      matrix:
        include:
          # 仅保留 win-amd64 与 linux-arm64
          - { name: Windows-amd64, platform: "windows/amd64" }
          - { name: Linux-arm64, platform: "linux/arm64" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install NSIS
        if: matrix.name == 'Windows-amd64'
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build packages
        env:
          CGO_ENABLED: "0"
        run: |
          go tool mygo build -platform "${{ matrix.platform }}"

      # 仅提取 .deb 和 .exe 安装包（连同 SHA256SUMS 校验文件）
      - name: Flatten packages
        run: |
          mkdir -p dist
          find build -type f \( -name "*.deb" -o -name "*-setup-*.exe" -o -name "SHA256SUMS" \) -exec cp {} dist/ \;

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
